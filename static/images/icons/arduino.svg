<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="28" fill="#dbeafe"/>
  <rect x="35" y="55" width="130" height="95" rx="8" fill="#0f9d58"/>
  <rect x="35" y="55" width="130" height="95" rx="8" fill="none" stroke="#0b7a43" stroke-width="3"/>
  <!-- USB port -->
  <rect x="20" y="70" width="22" height="26" rx="3" fill="#94a3b8"/>
  <!-- barrel jack -->
  <circle cx="30" cy="130" r="10" fill="#1e293b"/>
  <!-- big chip -->
  <rect x="85" y="80" width="45" height="35" rx="3" fill="#1e293b"/>
  <circle cx="90" cy="85" r="2" fill="#f8fafc"/>
  <!-- small chip -->
  <rect x="140" y="75" width="18" height="18" rx="2" fill="#1e293b"/>
  <!-- reset button -->
  <circle cx="145" cy="105" r="6" fill="#ef4444"/>
  <!-- LED -->
  <circle cx="145" cy="120" r="4" fill="#22c55e"/>
  <!-- pin headers top -->
  <g fill="#111827">
    <rect x="45" y="55" width="6" height="10"/>
    <rect x="58" y="55" width="6" height="10"/>
    <rect x="71" y="55" width="6" height="10"/>
    <rect x="84" y="55" width="6" height="10"/>
    <rect x="97" y="55" width="6" height="10"/>
    <rect x="110" y="55" width="6" height="10"/>
    <rect x="123" y="55" width="6" height="10"/>
    <rect x="136" y="55" width="6" height="10"/>
    <rect x="149" y="55" width="6" height="10"/>
  </g>
  <!-- pin headers bottom -->
  <g fill="#111827">
    <rect x="45" y="140" width="6" height="10"/>
    <rect x="58" y="140" width="6" height="10"/>
    <rect x="71" y="140" width="6" height="10"/>
    <rect x="84" y="140" width="6" height="10"/>
    <rect x="97" y="140" width="6" height="10"/>
    <rect x="110" y="140" width="6" height="10"/>
    <rect x="123" y="140" width="6" height="10"/>
    <rect x="136" y="140" width="6" height="10"/>
    <rect x="149" y="140" width="6" height="10"/>
  </g>
  <text x="100" y="105" font-size="9" fill="#e2fce9" text-anchor="middle" font-family="monospace">ARDUINO</text>
</svg>
